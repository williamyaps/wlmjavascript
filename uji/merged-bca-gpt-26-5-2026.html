const frameBCA = document.getElementById('frameBCA');
const frameNONBCA = document.getElementById('frameNONBCA');

const btnBCA = document.getElementById('btnBCA');
const btnNONBCA = document.getElementById('btnNONBCA');

const loader = document.getElementById('loader');

function showLoader() {
    loader.style.display = 'flex';
}

function hideLoader() {
    loader.style.display = 'none';
}

function cleanupFrame(frame) {

    try {

        const win = frame.contentWindow;

        if (!win) return;

        const highestTimeout = win.setTimeout(() => {}, 0);

        for(let i=0;i<=highestTimeout;i++) {
            win.clearTimeout(i);
        }

        const highestInterval = win.setInterval(() => {}, 0);

        for(let i=0;i<=highestInterval;i++) {
            win.clearInterval(i);
        }

        if (win.Chart && win.Chart.instances) {
            Object.values(win.Chart.instances).forEach(c => {
                try {
                    c.destroy();
                } catch(e) {}
            });
        }

    } catch(e) {
        console.log(e);
    }
}

function setActive(mode) {

    frameBCA.classList.remove('active');
    frameNONBCA.classList.remove('active');

    btnBCA.classList.remove('active');
    btnNONBCA.classList.remove('active');

    if(mode === 'bca') {
        frameBCA.classList.add('active');
        btnBCA.classList.add('active');
    } else {
        frameNONBCA.classList.add('active');
        btnNONBCA.classList.add('active');
    }
}

    cleanupFrame(frameNONBCA);

    setTimeout(() => {
        setActive('bca');
        hideLoader();
    }, 300);
}

function switchToNONBCA() {

    showLoader();

    cleanupFrame(frameBCA);

    setTimeout(() => {
        setActive('nonbca');
        hideLoader();
    }, 300);
}

btnBCA.onclick = switchToBCA;
btnNONBCA.onclick = switchToNONBCA;

frameBCA.srcdoc = graphHTML;
frameNONBCA.srcdoc = nonbcaHTML;

</script>
