<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jam Digital dan Cuaca Embed</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

  <style>
    /*
    * IMPLEMENTASI FONT STACK YANG KAMU SARANKAN
    * Ini memaksa browser mencari font emoji spesifik terlebih dahulu
    */
    .emoji-fix {
      font-family: 
        /* Emoji Font Stack (dari saran Anda) */
        "Segoe UI Emoji", "Segoe UI Symbol", "Apple Color Emoji", "Noto Color Emoji",
        /* Font Teks Utama */
        'Inter', system-ui, -apple-system, BlinkMacSystemFont, 
        "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; 
    }

    body {
      margin: 0;
      /* Aplikasikan perbaikan font ke body */
      font-family: 'Inter', system-ui, sans-serif; 
      background: #0f172a;
      color: #e5e7eb;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 720px;
      width: 100%;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px #00000055;
      /* Aplikasikan perbaikan font ke card */
      /* Ini memastikan semua teks di dalam card menggunakan font stack baru */
      font-family: var(--emoji-fix); /* Gunakan kelas jika perlu, tapi kita akan gunakan kelas di div yang butuh emoji */
    }
    .title {
      font-size: 2em;
      font-weight: 700;
      color: #22d3ee;
      text-align: center;
      margin-bottom: 12px;
    }
    .value {
      font-size: 3em;
      font-weight: 600;
      text-align: center;
      margin: 12px 0;
      font-family: 'Space Mono', monospace; 
    }
    .sub {
      font-size: 1em;
      color: #9ca3af;
      text-align: center;
    }
    .info {
      margin-top: 16px;
      font-size: 14px;
      color: #22d3ee;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="sapaan" class="info emoji-fix"></div> <div class="title emoji-fix">Jam Digital ?</div> <div id="jam" class="value">00:00:00</div>
    <div id="tanggal" class="sub">Senin, 1 Januari 1970</div>

    <div class="title emoji-fix" style="margin-top: 24px;">Cuaca Lokasi Anda ???</div> <div id="lokasi" class="sub">Memuat lokasi…</div>
    <div id="suhu" class="value">— °C</div>
    <div id="angin" class="sub">Angin: — km/j</div>
    <div id="arah" class="sub">Arah: —</div>
    
    <div class="title emoji-fix" style="margin-top: 24px;">IP Address Anda ???</div> <div id="ip-address" class="value">Memuat...</div>
    <div class="sub" id="ucapan-embed">Terima kasih telah meng-embed widget ini!</div>

    <div class="title emoji-fix" style="margin-top: 24px;">Pemeriksaan ISP (DNS)</div> <div id="dns-info" class="sub">Sedang mengambil Hostname/ISP...</div>

    <div id="ucapan" class="info emoji-fix"></div> </div>

  <script>
    const $ = (id) => document.getElementById(id);

    // ... (Fungsi Jam digital, Sapaan, Cuaca, Kirim Tinggi, IP/DNS tetap sama)
    function updateJam() {
      const now = new Date();
      $("jam").textContent = now.toLocaleTimeString('id-ID', { hour12: false });
      $("tanggal").textContent = now.toLocaleDateString('id-ID', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }
    setInterval(updateJam, 1000);
    updateJam();

    const params = new URLSearchParams(location.search);
    const nama = params.get("nama");
    if (nama) {
      $("sapaan").textContent = `Halo ${nama}, selamat datang di Jam Digital.`;
    }

    function toCardinal(deg) {
      const dirs = ["U", "Timur Laut", "T", "Tenggara", "S", "Barat Daya", "B", "Barat Laut"];
      return dirs[Math.round(deg / 45) % 8];
    }

    async function fetchWeather(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,wind_direction_10m&timezone=auto`;
      const res = await fetch(url);
      const data = await res.json();
      return {
        temp: data.current?.temperature_2m,
        wind: data.current?.wind_speed_10m,
        dir: data.current?.wind_direction_10m
      };
    }

    async function reverseGeocode(lat, lon) {
      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;
      const res = await fetch(url, { headers: { "Accept-Language": "id" } });
      const json = await res.json();
      return json.display_name || `Lat ${lat.toFixed(4)}, Lon ${lon.toFixed(4)}`;
    }

    navigator.geolocation.getCurrentPosition(async (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      try {
        const [namaLokasi, cuaca] = await Promise.all([
          reverseGeocode(lat, lon).catch(() => `Lat ${lat.toFixed(4)}, Lon ${lon.toFixed(4)}`),
          fetchWeather(lat, lon)
        ]);

        $("lokasi").textContent = namaLokasi;
        
        const suhuText = cuaca.temp != null ? `${cuaca.temp} \u00B0C` : "— \u00B0C"; 
        $("suhu").textContent = suhuText;
        
        $("angin").textContent = cuaca.wind != null ? `Angin: ${cuaca.wind} km/j` : "Angin: — km/j";
        
        $("arah").textContent = cuaca.dir != null ? `Arah: ${toCardinal(cuaca.dir)} (${Math.round(cuaca.dir)}\u00B0)` : "Arah: —";
        
        $("ucapan").textContent = "Terima kasih telah menggunakan Jam Digital William.";
      } catch {
        $("lokasi").textContent = "Gagal memuat cuaca.";
      }
    }, () => {
      $("lokasi").textContent = "Izin lokasi ditolak.";
    });

    function kirimTinggi() {
      const tinggi = document.documentElement.scrollHeight;
      parent.postMessage({ type: 'jamdigital:resize', height: tinggi }, '*');
    }
    window.addEventListener('load', kirimTinggi);
    new ResizeObserver(kirimTinggi).observe(document.body);
    
    async function getIpAndDns() {
        const ipDisplay = $("ip-address");
        const dnsDisplay = $("dns-info");
        
        try {
            const res = await fetch('https://ipinfo.io/json');
            const data = await res.json();
            
            if (data.ip) {
                ipDisplay.textContent = data.ip;
                
                const org = data.org || 'Tidak tersedia';
                dnsDisplay.textContent = `ISP: ${org}`;

            } else {
                ipDisplay.textContent = 'Gagal memuat IP.';
                dnsDisplay.textContent = 'Gagal memuat Hostname/ISP.';
            }

        } catch (error) {
            console.error("Gagal mengambil data IP/DNS:", error);
            ipDisplay.textContent = 'Error koneksi IP/DNS.';
            dnsDisplay.textContent = 'Error koneksi Hostname/ISP.';
        } finally {
             kirimTinggi(); 
        }
    }
    
    getIpAndDns(); 
  </script>
</body>
</html>
