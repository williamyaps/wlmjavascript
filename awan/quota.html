<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Kuota Pro</title>
    <style>
        /* Biar penuh se-layar HP */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .card { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 100%; /* Mengikuti lebar layar */
            max-width: 600px; /* Tapi jangan kelebaran di PC */
            border: 1px solid #334155;
        }

        h2 { color: #22d3ee; text-align: center; font-size: 1.8rem; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
        
        /* Input dibikin gede biar gampang diketik */
        input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 12px; 
            border: 2px solid #334155; 
            background: #0f172a; 
            color: #fff; 
            font-size: 1.1rem;
            outline: none;
        }
        input:focus { border-color: #22d3ee; }

        .time-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        
        /* Tombol mentereng */
        button { 
            width: 100%; 
            padding: 18px; 
            border: none; 
            border-radius: 12px; 
            background: linear-gradient(135deg, #22d3ee, #0ea5e9); 
            color: #0f172a; 
            font-size: 1.2rem; 
            font-weight: 800; 
            cursor: pointer; 
            margin-top: 10px;
            text-transform: uppercase;
        }
        button:active { transform: scale(0.98); }

        #result { 
            margin-top: 25px; 
            padding: 20px; 
            border-radius: 15px; 
            background: #0f172a; 
            border-left: 5px solid #22d3ee;
            display: none; 
        }
        .res-item { margin-bottom: 10px; font-size: 1.1rem; }
        .res-val { color: #22d3ee; font-weight: bold; font-family: monospace; display: block; font-size: 1.3rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>📊 Kalkulator Kuota</h2>
    
    <div class="input-group">
        <label>Kecepatan (KB/s):</label>
        <input type="number" id="speed" value="897">
    </div>

    <label>Durasi Menonton:</label>
    <div class="time-inputs">
        <div class="input-group">
            <label style="font-size: 10px;">JAM</label>
            <input type="number" id="hr" value="0">
        </div>
        <div class="input-group">
            <label style="font-size: 10px;">MENIT</label>
            <input type="number" id="min" value="4">
        </div>
        <div class="input-group">
            <label style="font-size: 10px;">DETIK</label>
            <input type="number" id="sec" value="24">
        </div>
    </div>

    <button onclick="hitung()">Hitung Kuota</button>

    <div id="result">
        <div class="res-item">Total Waktu: <span id="totalSec" class="res-val"></span></div>
        <div class="res-item">Total Byte: <span id="totalByte" class="res-val"></span></div>
        <div class="res-item">Total Megabyte: <span id="totalMB" class="res-val"></span></div>
    </div>
</div>

<script>
    function hitung() {
        const speed = parseFloat(document.getElementById('speed').value) || 0;
        const hr = parseInt(document.getElementById('hr').value) || 0;
        const min = parseInt(document.getElementById('min').value) || 0;
        const sec = parseInt(document.getElementById('sec').value) || 0;

        const totalDetik = (hr * 3600) + (min * 60) + sec;
        const totalKB = speed * totalDetik;
        const totalByte = totalKB * 1024;
        const totalMB = totalKB / 1024;

        document.getElementById('totalSec').innerText = totalDetik.toLocaleString('id-ID') + " Detik";
        document.getElementById('totalByte').innerText = totalByte.toLocaleString('id-ID') + " Byte";
        document.getElementById('totalMB').innerText = totalMB.toFixed(2) + " MB";
        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
