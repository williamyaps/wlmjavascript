<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Kuota Rapi v7</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: white; padding: 15px; margin: 0; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 500px; margin: auto; border: 1px solid #334155; }
        h2 { color: #22d3ee; text-align: center; margin-bottom: 20px; }
        
        .input-box { background: #0f172a; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #334155; }
        label { display: block; font-size: 10px; color: #94a3b8; font-weight: bold; text-transform: uppercase; }
        input { width: 100%; background: transparent; border: none; color: #fff; font-size: 1.2rem; outline: none; padding: 5px 0; }
        
        .grid-time { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
        button { width: 100%; padding: 18px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 1.2rem; background: #22d3ee; color: #0f172a; margin-top: 10px; }

        .result-panel { background: #0f172a; border-radius: 15px; padding: 20px; display: none; border: 1px solid #22d3ee; margin-top: 20px; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; }
        .val { color: #22d3ee; font-weight: bold; font-family: monospace; }
        .highlight { color: #f59e0b; font-weight: bold; text-align: center; display: block; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>💰 Kalkulator Anti-Hancur</h2>
    
    <div class="input-box"><label>Total Kuota (GB)</label><input type="number" id="totalGB" value="18"></div>
    
    <!-- Input harga dengan format otomatis -->
    <div class="input-box">
        <label>Harga Paket (Rp)</label>
        <input type="text" id="hargaInput" value="85.000" oninput="formatRupiah(this)">
    </div>

    <div class="input-box"><label>Kecepatan (KB/s)</label><input type="number" id="speed" value="897"></div>

    <div class="input-box">
        <label>Durasi Pemakaian</label>
        <div class="grid-time">
            <input type="number" id="day" value="0" placeholder="Hr">
            <input type="number" id="hr" value="0" placeholder="Jam">
            <input type="number" id="min" value="4" placeholder="Min">
            <input type="number" id="sec" value="24" placeholder="Det">
        </div>
    </div>

    <button onclick="hitungSemua()">CEK NASIB KUOTA</button>

    <div id="result" class="result-panel">
        <div class="row"><span>Biaya Per Detik:</span> <span class="val" id="rpSec"></span></div>
        <div class="row"><span>Biaya Per Jam:</span> <span class="val" id="rpJam"></span></div>
        <div class="row"><span>Data Per Jam:</span> <span class="val" id="gbJam"></span></div>
        <div class="row" style="border:none; margin-top:10px; font-size: 1.2rem;">
            <span>Uang Melayang:</span> <span class="val" id="totalRp"></span>
        </div>
        <span class="highlight" id="kapanHabis"></span>
    </div>
</div>

<script>
    // Fungsi ajaib kasih titik otomatis saat ketik
    function formatRupiah(input) {
        let val = input.value.replace(/\D/g, "");
        input.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function hitungSemua() {
        const tGB = parseFloat(document.getElementById('totalGB').value) || 1;
        // Ambil harga dan buang titiknya buat dihitung
        const hrg = parseFloat(document.getElementById('hargaInput').value.replace(/\./g, "")) || 0;
        const spd = parseFloat(document.getElementById('speed').value) || 0;
        
        const totalDetik = (parseInt(document.getElementById('day').value || 0) * 86400) + 
                           (parseInt(document.getElementById('hr').value || 0) * 3600) + 
                           (parseInt(document.getElementById('min').value || 0) * 60) + 
                           parseInt(document.getElementById('sec').value || 0);

        const hargaPerKB = hrg / (tGB * 1024 * 1024);
        const rpDetik = spd * hargaPerKB;
        const totalUang = rpDetik * totalDetik;
        const gbJam = (spd * 3600) / (1024 * 1024);

        // Tampilkan dengan format titik (Locale ID)
        document.getElementById('rpSec').innerText = "Rp " + rpDetik.toLocaleString('id-ID', {minimumFractionDigits: 2});
        document.getElementById('rpJam').innerText = "Rp " + Math.round(rpDetik * 3600).toLocaleString('id-ID');
        document.getElementById('gbJam').innerText = gbJam.toFixed(2) + " GB";
        document.getElementById('totalRp').innerText = "Rp " + Math.round(totalUang).toLocaleString('id-ID');

        const sisaDetik = ((tGB * 1024 * 1024) - (spd * totalDetik)) / spd;
        document.getElementById('kapanHabis').innerText = "Habis dalam " + Math.floor(sisaDetik/3600) + " jam lagi.";
        document.getElementById('result').style.display = 'block';
    }
</script>
</body>
</html>
