<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Kuota Sultan</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: white; padding: 15px; margin: 0; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 550px; margin: auto; border: 1px solid #334155; }
        h2 { color: #22d3ee; text-align: center; margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }
        
        .section-title { font-size: 14px; color: #f59e0b; margin-top: 20px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        label { display: block; margin: 12px 0 5px; font-size: 12px; color: #94a3b8; font-weight: bold; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
        
        .grid-time { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
        .btn-calc { width: 100%; padding: 18px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 1.2rem; margin-top: 20px; background: #22d3ee; color: #0f172a; transition: 0.3s; }
        .btn-calc:active { transform: scale(0.95); }

        #result { margin-top: 25px; padding: 20px; border-radius: 15px; background: #0f172a; display: none; border: 1px solid #22d3ee; }
        .res-row { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px dashed #334155; padding-bottom: 5px; }
        .res-label { color: #94a3b8; font-size: 14px; }
        .res-val { color: #22d3ee; font-weight: bold; font-family: monospace; }
        .warning { color: #f43f5e; font-weight: bold; text-align: center; margin-top: 15px; font-size: 14px; background: rgba(244, 63, 94, 0.1); padding: 10px; border-radius: 10px; }
        .safe { color: #10b981; font-weight: bold; text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>💰 Anti Rugi Quota</h2>
    
    <div class="section-title">INFO PAKET DATA</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
            <label>Total GB Beli:</label>
            <input type="number" id="totalGB" value="18" placeholder="GB">
        </div>
        <div>
            <label>Harga Paket (Rp):</label>
            <input type="number" id="hargaPaket" value="450000" placeholder="Rupiah">
        </div>
    </div>

    <div class="section-title">KONSUMSI SAAT INI</div>
    <label>Kecepatan (KB/s) - <i>Misal: 897</i></label>
    <input type="number" id="speed" value="897">

    <label>Durasi Pemakaian:</label>
    <div class="grid-time">
        <div><label style="font-size: 9px;">HARI</label><input type="number" id="day" value="0"></div>
        <div><label style="font-size: 9px;">JAM</label><input type="number" id="hr" value="0"></div>
        <div><label style="font-size: 9px;">MENIT</label><input type="number" id="min" value="4"></div>
        <div><label style="font-size: 9px;">DETIK</label><input type="number" id="sec" value="24"></div>
    </div>

    <button class="btn-calc" onclick="hitungSultan()">CEK NASIB KUOTA</button>

    <div id="result">
        <div class="res-row"><span class="res-label">Biaya Per Detik:</span> <span class="res-val" id="rpPerSec"></span></div>
        <div class="res-row"><span class="res-label">Total Data Terpakai:</span> <span class="res-val" id="dataUsed"></span></div>
        <div class="res-row"><span class="res-label">Uang Hangus (Rp):</span> <span class="res-val" id="uangHangus"></span></div>
        <hr style="border: 0.5px solid #334155;">
        <div class="res-row"><span class="res-label">Sisa Kuota:</span> <span class="res-val" id="sisaQuota"></span></div>
        <div class="res-row" style="border:none;"><span class="res-label">Kuota Akan Habis Dalam:</span> <span class="res-val" id="timeLeft" style="color:#f59e0b;"></span></div>
        <div id="statusPesan"></div>
    </div>
</div>

<script>
    function hitungSultan() {
        // Ambil Data Input
        const totalGBBeli = parseFloat(document.getElementById('totalGB').value) || 0;
        const hargaPaket = parseFloat(document.getElementById('hargaPaket').value) || 0;
        const speedKB = parseFloat(document.getElementById('speed').value) || 0;
        
        const d = parseInt(document.getElementById('day').value) || 0;
        const h = parseInt(document.getElementById('hr').value) || 0;
        const m = parseInt(document.getElementById('min').value) || 0;
        const s = parseInt(document.getElementById('sec').value) || 0;

        // 1. Hitung Total Waktu Detik
        const totalDetik = (d * 86400) + (h * 3600) + (m * 60) + s;

        // 2. Hitung Harga per KB dan per Detik
        const totalKBBeli = totalGBBeli * 1024 * 1024; 
        const hargaPerKB = hargaPaket / totalKBBeli;
        const hargaPerDetik = speedKB * hargaPerKB;

        // 3. Konsumsi Data & Uang
        const dataTerpakaiKB = speedKB * totalDetik;
        const dataTerpakaiMB = dataTerpakaiKB / 1024;
        const uangTerpakai = dataTerpakaiKB * hargaPerKB;

        // 4. Sisa & Prediksi Habis
        const sisaKB = totalKBBeli - dataTerpakaiKB;
        const sisaDetik = speedKB > 0 ? sisaKB / speedKB : 0;
        
        // Konversi sisa detik ke Hari/Jam
        const sisaHari = Math.floor(sisaDetik / 86400);
        const sisaJam = Math.floor((sisaDetik % 86400) / 3600);

        // Tampilkan Hasil
        document.getElementById('rpPerSec').innerText = "Rp " + hargaPerDetik.toFixed(2);
        document.getElementById('dataUsed').innerText = dataTerpakaiMB.toFixed(2) + " MB";
        document.getElementById('uangHangus').innerText = "Rp " + Math.round(uangTerpakai).toLocaleString('id-ID');
        document.getElementById('sisaQuota').innerText = (sisaKB / (1024*1024)).toFixed(2) + " GB";
        document.getElementById('timeLeft').innerText = sisaHari + " Hari " + sisaJam + " Jam";

        // Pesan Peringatan
        const pesanBox = document.getElementById('statusPesan');
        if (sisaHari < 3) {
            pesanBox.className = "warning";
            pesanBox.innerText = "⚠️ DARURAT! Kuota tewas dalam kurang dari 3 hari. Kurangi nonton 2K!";
        } else if (sisaHari > 30) {
            pesanBox.className = "safe";
            pesanBox.innerText = "✅ AMAN! Kuota awet sampai bulan depan. Gaspol terus!";
        } else {
            pesanBox.className = "safe";
            pesanBox.innerText = "👍 Pas! Kuota cukup untuk sebulan.";
        }

        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
