<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Jujur v5</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: white; padding: 15px; margin: 0; }
        .card { background: #1e293b; padding: 20px; border-radius: 20px; width: 100%; max-width: 500px; margin: auto; border: 1px solid #334155; }
        h2 { color: #22d3ee; text-align: center; margin: 0 0 20px 0; }
        
        .input-box { background: #0f172a; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        label { display: block; font-size: 11px; color: #94a3b8; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        input { width: 100%; background: transparent; border: none; color: #fff; font-size: 1.2rem; outline: none; border-bottom: 2px solid #334155; padding: 5px 0; }
        input:focus { border-bottom-color: #22d3ee; }

        button { width: 100%; padding: 18px; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; font-size: 1.1rem; background: #22d3ee; color: #0f172a; margin-bottom: 20px; transition: 0.2s; }
        button:active { transform: scale(0.98); }

        .result-panel { background: #0f172a; border-radius: 15px; padding: 15px; display: none; border: 1px solid #22d3ee; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; }
        .row:last-child { border: none; }
        .label { color: #94a3b8; font-size: 13px; }
        .val { color: #22d3ee; font-weight: bold; }
        
        .highlight-box { background: rgba(34, 211, 238, 0.1); padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px dashed #22d3ee; }
        .warn { color: #f43f5e; font-size: 12px; text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>📊 Kalkulator Jujur</h2>
    
    <div class="input-box">
        <label>Paket Data (GB):</label>
        <input type="number" id="totalGB" value="18">
    </div>

    <div class="input-box">
        <label>Harga Paket (Rp):</label>
        <input type="number" id="harga" value="450000">
    </div>

    <div class="input-box">
        <label>Kecepatan (KB/s):</label>
        <input type="number" id="speed" value="897">
    </div>

    <button onclick="hitung()">CEK RINCIAN BIAYA</button>

    <div id="result" class="result-panel">
        <div class="row"><span class="label">Harga 1 GB:</span> <span class="val" id="pricePerGB"></span></div>
        <div class="row"><span class="label">Harga 1 MB:</span> <span class="val" id="pricePerMB"></span></div>
        
        <div class="highlight-box">
            <div style="text-align: center; font-size: 14px; margin-bottom: 10px; color: #f59e0b;">JIKA KAMU PAKAI 1 JAM:</div>
            <div class="row"><span class="label">Data Ludes:</span> <span class="val" id="gbPerHour"></span></div>
            <div class="row"><span class="label">Uang Hangus:</span> <span class="val" id="rpPerHour"></span></div>
        </div>

        <div id="summary" class="warn"></div>
    </div>
</div>

<script>
    function hitung() {
        const totalGB = parseFloat(document.getElementById('totalGB').value) || 1;
        const harga = parseFloat(document.getElementById('harga').value) || 0;
        const speed = parseFloat(document.getElementById('speed').value) || 0;

        // 1. Hitung harga satuan
        const pricePerGB = harga / totalGB;
        const pricePerMB = pricePerGB / 1024;

        // 2. Hitung penggunaan per jam (3600 detik)
        const mbPerSec = speed / 1024;
        const mbPerHour = mbPerSec * 3600;
        const gbPerHour = mbPerHour / 1024;
        const rpPerHour = mbPerHour * pricePerMB;

        // 3. Tampilkan
        document.getElementById('pricePerGB').innerText = "Rp " + Math.round(pricePerGB).toLocaleString('id-ID');
        document.getElementById('pricePerMB').innerText = "Rp " + pricePerMB.toFixed(2);
        document.getElementById('gbPerHour').innerText = gbPerHour.toFixed(2) + " GB";
        document.getElementById('rpPerHour').innerText = "Rp " + Math.round(rpPerHour).toLocaleString('id-ID');

        // 4. Prediksi Ketahanan
        const totalJamKuat = totalGB / gbPerHour;
        document.getElementById('summary').innerText = "⚠️ Dengan kecepatan ini, paket 18GB kamu cuma bertahan " + totalJamKuat.toFixed(1) + " jam saja!";

        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
