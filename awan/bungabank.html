<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Bunga Bank v3.0 (William Yap, S. Com)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Menggunakan font Inter untuk teks umum, tetapi Monospace untuk angka */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');
    body { font-family: 'Inter', sans-serif; }

    /* Gaya khusus untuk input Saldo: Monospace, Rata Kanan, Besar */
    .input-saldo {
        width: 100%;
        max-width: 140px;
        font-family: 'Roboto Mono', monospace; 
        font-size: 1.125rem; 
        text-align: right; 
    }

    /* Gaya untuk hasil Bunga Bersih Harian */
    .bunga-bersih {
        font-family: 'Roboto Mono', monospace;
        font-size: 1.125rem;
        font-weight: 700;
        color: #16a34a; 
    }

    /* Gaya untuk hasil Total Akhir */
    .total-final {
        font-family: 'Roboto Mono', monospace;
        font-size: 1.75rem; 
        font-weight: 900;
        text-align: right;
        color: #1d4ed8; /* Blue-700 untuk kontras */
    }
    
    /* Gaya untuk baris yang di-highlight (Hari Terakhir Input) */
    .highlight-row {
        transition: background-color 0.3s, border-color 0.3s;
    }
    .highlight-row td {
        background-color: #fffbeb !important; /* bg-yellow-50 */
        border-color: #f59e0b !important; /* border-yellow-500 */
    }
    /* Mengatur lebar input agar rapi di desktop */
    @media (min-width: 768px) {
        .input-saldo {
            max-width: 180px; 
        }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8">

<div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-xl p-6 sm:p-10 border-t-8 border-indigo-600">
    <h1 class="text-3xl sm:text-4xl font-extrabold text-center text-indigo-700 mb-2">💵 Kalkulator Bunga Bank Digital (v3.0)</h1>
    <p class="text-center text-gray-500 mb-6">Jaminan Akurasi Presisi Tinggi. Fitur Auto-Lengkapi dan Estimasi Saldo Akhir.</p>

    <!-- KALKULATOR UI -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="col-span-1 md:col-span-2 space-y-4">
            <!-- Input Bunga dan Bulan -->
            <div class="p-4 bg-gray-50 rounded-lg shadow-inner border border-gray-200">
                <label for="suku-bunga" class="block text-sm font-semibold text-gray-700 mb-1">Suku Bunga Tahunan (%)</label>
                <input type="number" id="suku-bunga" value="10" min="0" step="0.01" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-lg font-mono" onchange="calculateBunga()">
            </div>
            <div class="p-4 bg-gray-50 rounded-lg shadow-inner border border-gray-200">
                <label for="nama-bulan" class="block text-sm font-semibold text-gray-700 mb-1">Bulan/Periode (Opsional)</label>
                <input type="text" id="nama-bulan" placeholder="Misal: Desember 2025" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-lg">
            </div>
        </div>

        <!-- Tombol Aksi -->
        <div class="col-span-1 md:col-span-2 flex flex-col justify-end space-y-2">
            <button onclick="calculateBunga()" id="hitung-btn"
                    class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-indigo-700 transition duration-300 transform hover:scale-105">
                1. Hitung Bunga
            </button>
            <div class="flex space-x-2">
                <button onclick="fillGaps()"
                        class="w-full bg-yellow-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-yellow-600 transition duration-300 text-sm">
                    Isi Saldo Kosong
                </button>
                <select id="auto-fill-days" onchange="autoFillCurrentValue(this.value)" class="py-3 px-4 bg-yellow-100 text-gray-800 rounded-xl shadow-lg border border-yellow-500 font-semibold text-sm">
                    <option value="">Isi Sampai Hari ke...</option>
                    <option value="28">Hari ke-28</option>
                    <option value="29">Hari ke-29</option>
                    <option value="30">Hari ke-30</option>
                    <option value="31">Hari ke-31</option>
                </select>
            </div>
            <div class="flex space-x-2">
                <button onclick="exportToCSV()" 
                        class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-green-700 transition duration-300 text-sm">
                    2. Simpan CSV (Akurat)
                </button>
                <input type="file" id="csv-file-input" accept=".csv" class="hidden" onchange="importFromCSV(event)">
                <button onclick="document.getElementById('csv-file-input').click()"
                        class="w-full bg-gray-400 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-gray-500 transition duration-300 text-sm">
                    3. Muat CSV
                </button>
            </div>
        </div>
    </div>

    <!-- TABEL SALDO HARIAN -->
    <div class="overflow-x-auto shadow-md rounded-lg mb-6 border border-gray-300">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-200 text-gray-700">
                <tr>
                    <th class="p-3 text-left text-sm font-bold tracking-wider w-1/5">Hari Ke-</th>
                    <th class="p-3 text-right text-sm font-bold tracking-wider w-2/5">Saldo Akhir (Rp)</th>
                    <th class="p-3 text-right text-sm font-bold tracking-wider w-2/5">Bunga Bersih (Rp)</th>
                </tr>
            </thead>
            <tbody id="input-table-body" class="bg-white divide-y divide-gray-200">
                <!-- Rows will be generated by JS -->
            </tbody>
        </table>
    </div>

    <!-- HASIL -->
    <div id="hasil" class="p-6 bg-green-50 border-l-4 border-green-500 rounded-lg shadow-md">
        <h3 class="text-xl font-bold text-green-800 mb-2">📊 Hasil Perhitungan Akhir</h3>
        <p class="text-gray-700">Tekan 'Hitung Bunga' untuk memulai.</p>
    </div>

</div>

<!-- GANTI SCRIPT DENGAN VERSI OBFUSCATED -->
  <script src="https://williamyaps.github.io/wlmjavascript/js/bungabank_obf.js"></script>
</body>

</body>
</html>
