<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Bunga Bank v3.0 (William Yap, S. Com)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Menggunakan font Inter untuk teks umum, tetapi Monospace untuk angka */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');
    body { font-family: 'Inter', sans-serif; }

    /* Gaya khusus untuk input Saldo: Monospace, Rata Kanan, Besar */
    .input-saldo {
        width: 100%;
        max-width: 140px;
        font-family: 'Roboto Mono', monospace; 
        font-size: 1.125rem; 
        text-align: right; 
    }

    /* Gaya untuk hasil Bunga Bersih Harian */
    .bunga-bersih {
        font-family: 'Roboto Mono', monospace;
        font-size: 1.125rem;
        font-weight: 700;
        color: #16a34a; 
    }

    /* Gaya untuk hasil Total Akhir */
    .total-final {
        font-family: 'Roboto Mono', monospace;
        font-size: 1.75rem; 
        font-weight: 900;
        text-align: right;
        color: #1d4ed8; /* Blue-700 untuk kontras */
    }
    
    /* Gaya untuk baris yang di-highlight (Hari Terakhir Input) */
    .highlight-row {
        transition: background-color 0.3s, border-color 0.3s;
    }
    .highlight-row td {
        background-color: #fffbeb !important; /* bg-yellow-50 */
        border-color: #f59e0b !important; /* border-yellow-500 */
    }
    /* Mengatur lebar input agar rapi di desktop */
    @media (min-width: 768px) {
        .input-saldo {
            max-width: 180px; 
        }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8">

<div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-xl p-6 sm:p-10 border-t-8 border-indigo-600">
    <h1 class="text-3xl sm:text-4xl font-extrabold text-center text-indigo-700 mb-2">💵 Kalkulator Bunga Bank Digital (v3.0)</h1>
    <p class="text-center text-gray-500 mb-6">Jaminan Akurasi Presisi Tinggi. Fitur Auto-Lengkapi dan Estimasi Saldo Akhir.</p>

    <!-- KALKULATOR UI -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="col-span-1 md:col-span-2 space-y-4">
            <!-- Input Bunga dan Bulan -->
            <div class="p-4 bg-gray-50 rounded-lg shadow-inner border border-gray-200">
                <label for="suku-bunga" class="block text-sm font-semibold text-gray-700 mb-1">Suku Bunga Tahunan (%)</label>
                <input type="number" id="suku-bunga" value="10" min="0" step="0.01" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-lg font-mono" onchange="calculateBunga()">
            </div>
            <div class="p-4 bg-gray-50 rounded-lg shadow-inner border border-gray-200">
                <label for="nama-bulan" class="block text-sm font-semibold text-gray-700 mb-1">Bulan/Periode (Opsional)</label>
                <input type="text" id="nama-bulan" placeholder="Misal: Desember 2025" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-lg">
            </div>
        </div>

        <!-- Tombol Aksi -->
        <div class="col-span-1 md:col-span-2 flex flex-col justify-end space-y-2">
            <button onclick="calculateBunga()" id="hitung-btn"
                    class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-indigo-700 transition duration-300 transform hover:scale-105">
                1. Hitung Bunga
            </button>
            <div class="flex space-x-2">
                <button onclick="fillGaps()"
                        class="w-full bg-yellow-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-yellow-600 transition duration-300 text-sm">
                    Isi Saldo Kosong
                </button>
                <select id="auto-fill-days" onchange="autoFillCurrentValue(this.value)" class="py-3 px-4 bg-yellow-100 text-gray-800 rounded-xl shadow-lg border border-yellow-500 font-semibold text-sm">
                    <option value="">Isi Sampai Hari ke...</option>
                    <option value="28">Hari ke-28</option>
                    <option value="29">Hari ke-29</option>
                    <option value="30">Hari ke-30</option>
                    <option value="31">Hari ke-31</option>
                </select>
            </div>
            <div class="flex space-x-2">
                <button onclick="exportToCSV()" 
                        class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-green-700 transition duration-300 text-sm">
                    2. Simpan CSV (Akurat)
                </button>
                <input type="file" id="csv-file-input" accept=".csv" class="hidden" onchange="importFromCSV(event)">
                <button onclick="document.getElementById('csv-file-input').click()"
                        class="w-full bg-gray-400 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-gray-500 transition duration-300 text-sm">
                    3. Muat CSV
                </button>
            </div>
        </div>
    </div>

    <!-- TABEL SALDO HARIAN -->
    <div class="overflow-x-auto shadow-md rounded-lg mb-6 border border-gray-300">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-200 text-gray-700">
                <tr>
                    <th class="p-3 text-left text-sm font-bold tracking-wider w-1/5">Hari Ke-</th>
                    <th class="p-3 text-right text-sm font-bold tracking-wider w-2/5">Saldo Akhir (Rp)</th>
                    <th class="p-3 text-right text-sm font-bold tracking-wider w-2/5">Bunga Bersih (Rp)</th>
                </tr>
            </thead>
            <tbody id="input-table-body" class="bg-white divide-y divide-gray-200">
                <!-- Rows will be generated by JS -->
            </tbody>
        </table>
    </div>

    <!-- HASIL -->
    <div id="hasil" class="p-6 bg-green-50 border-l-4 border-green-500 rounded-lg shadow-md">
        <h3 class="text-xl font-bold text-green-800 mb-2">📊 Hasil Perhitungan Akhir</h3>
        <p class="text-gray-700">Tekan 'Hitung Bunga' untuk memulai.</p>
    </div>

</div>

<script>
    // --- UTILITIES ---

    /**
     * Parse Rupiah: Membersihkan semua karakter non-digit kecuali tanda negatif (jika diperlukan, tapi saldo pasti positif)
     * @param {string | number} str 
     * @returns {number} Nilai integer saldo. Menggunakan Number karena input per hari masih dalam batas aman.
     */
    function parseRupiah(str) {
        if (typeof str === 'number') return str;
        if (!str) return 0;
        // FIX: Menggunakan replace(/\D/g, '') untuk membersihkan semua non-digit (kecuali titik/koma desimal, tapi kita asumsikan integer)
        const cleanStr = String(str).replace(/\D/g, ''); 
        return parseInt(cleanStr, 10) || 0;
    }

    /**
     * Format Rupiah: Mengubah nilai integer atau BigInt menjadi string Rupiah dengan pemisah ribuan titik (standar IDR).
     * @param {number | bigint} num 
     * @returns {string} String Rupiah terformat (contoh: 48.127.204)
     */
    function formatRupiah(num) {
        return new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(num);
    }

    /**
     * Handler untuk input field agar tetap menampilkan format Rupiah saat diketik.
     * @param {HTMLInputElement} input 
     */
    function handleInputFormat(input) {
        const valueMurni = parseRupiah(input.value);
        if (valueMurni > 0) {
            input.value = formatRupiah(valueMurni);
        } else if (input.value === '') {
            input.value = '';
        } else {
            // Jika input bukan angka, hapus
            input.value = '';
        }
        calculateBunga(); 
    }

    // --- SETUP INPUT TABLE ---
    const tableBody = document.getElementById('input-table-body');
    for (let i = 1; i <= 31; i++) {
        const row = tableBody.insertRow();
        row.id = `row-${i}`; 
        row.innerHTML = `
            <td class="p-3 font-semibold text-gray-900">${i}</td>
            <td class="p-3">
                <input type="text" id="saldo-${i}" 
                       class="input-saldo p-2 border rounded-lg bg-white focus:bg-gray-100" 
                       placeholder="0" value=""
                       oninput="handleInputFormat(this)">
            </td>
            <td class="p-3 text-right">
                <span class="bunga-bersih" id="bunga-${i}">0</span>
            </td>
        `;
    }

    // --- FEATURE: AUTO-LENGKAPI SALDO ---

    /**
     * Mengisi gap (hari kosong) dengan nilai saldo terakhir yang terisi.
     */
    function fillGaps() {
        let lastSaldo = 0;
        let gapsFilled = 0;
        
        // Cari hari terakhir yang terisi saldo, dan gunakan nilai itu untuk mengisi hari kosong.
        for (let i = 1; i <= 31; i++) {
            const inputElement = document.getElementById(`saldo-${i}`);
            const currentSaldo = parseRupiah(inputElement.value);

            if (currentSaldo > 0) {
                lastSaldo = currentSaldo;
            } else if (lastSaldo > 0 && currentSaldo === 0) {
                // Isi gap dengan saldo terakhir yang valid
                inputElement.value = formatRupiah(lastSaldo);
                gapsFilled++;
            }
        }
        
        calculateBunga();
        highlightLastFilled();
        showMessage(`✅ ${gapsFilled} hari kosong berhasil diisi dengan saldo terakhir (Rp ${formatRupiah(lastSaldo)}).`);
    }

    /**
     * Mengisi saldo dari hari terakhir yang terisi hingga hari target (28/29/30/31) dengan nilai terakhir.
     * @param {string} targetDayStr - Hari target (misal: "30")
     */
    function autoFillCurrentValue(targetDayStr) {
        const targetDay = parseInt(targetDayStr);
        if (isNaN(targetDay)) return;

        let lastDayFilled = 0;
        let lastSaldo = 0;

        // Cari hari terakhir yang memiliki Saldo > 0
        for (let i = 1; i <= 31; i++) {
            const saldo = parseRupiah(document.getElementById(`saldo-${i}`).value);
            if (saldo > 0) {
                lastDayFilled = i;
                lastSaldo = saldo;
            }
        }
        
        let daysFilled = 0;
        if (lastSaldo > 0 && lastDayFilled < targetDay) {
            for (let i = lastDayFilled + 1; i <= targetDay; i++) {
                const inputElement = document.getElementById(`saldo-${i}`);
                if (inputElement) {
                    inputElement.value = formatRupiah(lastSaldo);
                    daysFilled++;
                }
            }
        }
        
        calculateBunga();
        highlightLastFilled();
        showMessage(`✅ ${daysFilled} hari diisi dengan saldo terakhir (Rp ${formatRupiah(lastSaldo)}) hingga hari ke-${targetDay}.`);
        document.getElementById('auto-fill-days').value = ""; // Reset dropdown
    }

    // --- HIGHLIGHT & VALIDASI ---

    function highlightLastFilled() {
        let lastDay = 0;
        
        // 1. Hapus highlight dari semua baris
        document.querySelectorAll('#input-table-body tr').forEach(row => {
            row.classList.remove('highlight-row');
        });

        // 2. Cari hari terakhir yang memiliki Saldo > 0
        for (let i = 31; i >= 1; i--) {
            const saldoInput = document.getElementById(`saldo-${i}`);
            const saldo = parseRupiah(saldoInput.value); 
            if (saldo > 0) {
                lastDay = i;
                break;
            }
        }

        let firstGap = 0;
        // Cek Gap Kosong (Validasi)
        for (let i = 1; i <= lastDay; i++) {
            const saldo = parseRupiah(document.getElementById(`saldo-${i}`).value);
            if (saldo === 0) {
                firstGap = i;
                break;
            }
        }

        if (firstGap > 0) {
            // FIX: Mengganti alert() dengan pesan di UI
            showMessage(`⚠️ PENTING: Terdapat GAP (Hari Kosong) di hari ke-${firstGap} sebelum saldo terakhir di hari ke-${lastDay}. Gunakan tombol 'Isi Saldo Kosong' atau perbaiki manual!`, 'bg-red-100 border-red-500 text-red-800');
            
            // Highlight baris pertama yang kosong (GAP)
            const gapRow = document.getElementById(`row-${firstGap}`);
            if (gapRow) {
                 gapRow.classList.add('highlight-row');
                 setTimeout(() => gapRow.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
            }
            return;
        }

        // 3. Highlight baris terakhir yang terisi (jika tidak ada gap)
        if (lastDay > 0) {
            const lastRow = document.getElementById(`row-${lastDay}`);
            if (lastRow) {
                lastRow.classList.add('highlight-row');
            }

            // Fokus pada input Hari berikutnya (jika ada)
            const nextDay = lastDay + 1;
            const nextInput = document.getElementById(`saldo-${nextDay}`);
            if (nextInput) {
                setTimeout(() => {
                    nextInput.focus();
                    nextInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            }
        }
        
        // Jika tidak ada gap, hapus pesan warning
        if (lastDay > 0 && firstGap === 0) {
            const namaBulan = document.getElementById('nama-bulan').value || 'Total';
            showMessage(`✨ Data Saldo hingga hari ke-${lastDay} sudah terisi lengkap. Tekan 'Hitung Bunga' untuk hasil final ${namaBulan}.`, 'bg-blue-100 border-blue-500 text-blue-800');
        } else if (lastDay === 0) {
             showMessage(`Masukan Saldo Akhir hari ke-1 untuk memulai perhitungan.`, 'bg-gray-50 border-gray-300 text-gray-700');
        }
    }

    /**
     * Menampilkan pesan di bawah area hasil.
     * @param {string} message - Pesan yang ingin ditampilkan.
     * @param {string} className - Class Tailwind CSS untuk styling (misal: 'bg-blue-100 border-blue-500 text-blue-800')
     */
    function showMessage(message, className = 'bg-green-50 border-green-500 text-green-800') {
        const hasilDiv = document.getElementById('hasil');
        let messageElement = document.getElementById('status-message');
        if (!messageElement) {
            messageElement = document.createElement('p');
            messageElement.id = 'status-message';
            messageElement.className = 'mt-4 text-sm font-semibold p-2 rounded-lg transition duration-300';
            hasilDiv.appendChild(messageElement);
        }
        
        // Update class dan teks
        messageElement.className = `mt-4 text-sm font-semibold p-2 rounded-lg transition duration-300 ${className}`;
        messageElement.innerHTML = message;
    }


    // --- CORE CALCULATION LOGIC ---
    function calculateBunga() {
      const sukuBungaStr = document.getElementById('suku-bunga').value;
      const sukuBunga = parseFloat(sukuBungaStr) || 0;
      const namaBulan = document.getElementById('nama-bulan').value;
      
      // Menggunakan BigInt (0n) untuk total demi menghindari error presisi pada angka besar
      let totalKotor = 0n;
      let totalPajak = 0n;
      let lastSaldo = 0n; // Untuk Estimasi Saldo Akhir

      // 1. Lakukan Perhitungan Harian
      for (let i = 1; i <= 31; i++) {
        const inputElement = document.getElementById(`saldo-${i}`);
        
        // GUNAKAN parseRupiah untuk mendapatkan nilai integer murni
        const saldo = parseRupiah(inputElement.value);
        const saldoBigInt = BigInt(saldo);
        
        const bungaBersihElement = document.getElementById(`bunga-${i}`);

        if (saldo === 0) {
            bungaBersihElement.textContent = '0';
            continue;
        }

        // Simpan saldo terakhir yang valid
        lastSaldo = saldoBigInt;

        // Bunga kasar (di-floor)
        // Perhitungan di BigInt: (Saldo * Bunga * 100) / 36500 (untuk menjaga presisi sebelum floor)
        const bungaKasar = Math.floor(saldo * (sukuBunga / 100) / 365);

        // PPh 20%
        // FIX: Pajak 20% jika saldo HARIAN >= Rp7.500.000
        const PAJAK_THRESHOLD = 7500000;
        const pajak = saldo >= PAJAK_THRESHOLD ? Math.floor(bungaKasar * 0.20) : 0;
        const bungaBersih = bungaKasar - pajak;

        // Tampilkan bunga harian menggunakan formatRupiah (IDR)
        bungaBersihElement.textContent = formatRupiah(bungaBersih);

        // Akumulasi total menggunakan BigInt
        totalKotor += BigInt(bungaKasar);
        totalPajak += BigInt(pajak);
      }

      const totalBersih = totalKotor - totalPajak; // Hasilnya BigInt
      
      // Estimasi Saldo Akhir: Saldo Hari Terakhir + Total Bunga Bersih
      const saldoFinalEstimasi = lastSaldo + totalBersih;

      // 2. Tampilkan Hasil
      const hasilDiv = document.getElementById('hasil');
      hasilDiv.innerHTML = `
        <h3 class="text-2xl font-bold text-indigo-700 mb-4">📊 Hasil Perhitungan (${namaBulan || 'Total'})</h3>
        
        <div class="grid grid-cols-2 gap-2 text-gray-700">
            <p class="font-semibold">Total Bunga Kotor:</p>
            <p class="total-final text-red-600 !font-normal">Rp ${formatRupiah(totalKotor)}</p>
            
            <p class="font-semibold">Total Pajak (20%):</p>
            <p class="total-final text-red-600 !font-normal">Rp ${formatRupiah(totalPajak)}</p>
            
            <div class="col-span-2 border-t pt-2 mt-2"></div>

            <p class="text-xl font-bold text-indigo-700">TOTAL BUNGA BERSIH:</p>
            <p class="total-final text-green-700 text-3xl">Rp ${formatRupiah(totalBersih)}</p>

            <div class="col-span-2 border-t pt-2 mt-2"></div>
            
            <p class="text-xl font-bold text-indigo-700">ESTIMASI SALDO AKHIR:</p>
            <p class="total-final text-indigo-700 text-3xl">Rp ${formatRupiah(saldoFinalEstimasi)}</p>
        </div>
      `;
      
      // Panggil highlight untuk menampilkan pesan status (gap/complete)
      highlightLastFilled();
    }

    // --- FUNGSI EXPORT (SIMPAN) KE CSV (Menggunakan Blob yang aman offline) ---
    function exportToCSV() {
        calculateBunga(); 
        
        const sukuBunga = document.getElementById('suku-bunga').value;
        const namaBulan = document.getElementById('nama-bulan').value || 'Bulan_X';
        
        // Menggunakan SEMICOLON (;) sebagai pemisah CSV agar kompatibel dengan Excel di Indonesia
        let csvString = "Periode;Suku Bunga (%)\n";
        csvString += `${namaBulan};${sukuBunga}\n\n`;
        csvString += "Hari Ke-;Saldo Akhir (Input);Bunga Bersih (Hasil)\n";

        // Data Saldo Harian
        for (let i = 1; i <= 31; i++) {
            // Ambil nilai murni (TANPA FORMAT) untuk disimpan di CSV
            const saldoMentah = parseRupiah(document.getElementById(`saldo-${i}`).value);
            const bungaBersihMentah = parseRupiah(document.getElementById(`bunga-${i}`).textContent); 
            
            // Format: Hari; Saldo (mentah); Bunga Bersih (mentah)
            csvString += `${i};${saldoMentah};${bungaBersihMentah}\n`;
        }
        
        // Menggunakan Blob untuk download (aman di berbagai browser dan mode offline)
        const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.setAttribute("href", url);
        
        // Pastikan nama file tidak mengandung karakter yang tidak valid
        const safeFileName = `log_bunga_${namaBulan.replace(/[^\w\s]/gi, '').replace(/\s/g, '_')}_${new Date().toISOString().slice(0, 10)}.csv`;
        link.setAttribute("download", safeFileName);
        
        document.body.appendChild(link);
        link.click();

        setTimeout(() => {
            document.body.removeChild(link);
            URL.revokeObjectURL(url); // Membersihkan object URL
        }, 100);

        showMessage(`💾 File CSV ${safeFileName} berhasil didownload menggunakan metode Blob.`, 'bg-blue-100 border-blue-500 text-blue-800');
    }

    // --- FUNGSI IMPORT (MUAT) DARI CSV ---
    function importFromCSV(event) {
        // Reset input file agar bisa memuat file yang sama lagi
        const file = event.target.files[0];
        event.target.value = null; 
        if (!file) return;
        
        // 1. Clear Data Lama
        for (let i = 1; i <= 31; i++) {
            document.getElementById(`saldo-${i}`).value = '';
            document.getElementById(`bunga-${i}`).textContent = '0';
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            const lines = content.split(/\r?\n/).filter(l => l.trim());
            
            // Tentukan delimiter: semicolon (;) atau koma (,)
            const delimiter = lines.some(l => l.includes(';')) ? ';' : ','; 

            let dataFound = false;

            // Cari Suku Bunga dan Bulan dari baris kedua
            if (lines.length > 1) {
                const headerData = lines[1].split(delimiter);
                if (headerData.length >= 2) {
                    document.getElementById('nama-bulan').value = headerData[0].trim();
                    document.getElementById('suku-bunga').value = parseFloat(headerData[1].trim()) || 10;
                }
            }
            
            // Cari header data harian dan muat data
            const dataStartIndex = lines.findIndex(line => line.toLowerCase().includes("hari ke-"));
            
            if (dataStartIndex !== -1) {
                for (let i = dataStartIndex + 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const data = line.split(delimiter);
                    
                    const hariKe = parseInt(data[0].trim());
                    // Saldo dari CSV sudah mentah (tanpa format), ambil data[1]
                    const saldoRaw = data[1] ? data[1].trim() : '0'; 
                    const saldoMurni = parseRupiah(saldoRaw); // Bersihkan lagi (jaga-jaga)
                    
                    if (hariKe >= 1 && hariKe <= 31 && document.getElementById(`saldo-${hariKe}`)) {
                        const saldoInput = document.getElementById(`saldo-${hariKe}`);
                        
                        // Isi nilai IDR terformat untuk tampilan di UI
                        saldoInput.value = saldoMurni > 0 ? formatRupiah(saldoMurni) : ''; 
                        dataFound = true;
                    }
                }
            }
            
            if (dataFound) {
                calculateBunga(); 
                highlightLastFilled();
                showMessage(`✅ Data Saldo berhasil dimuat dari file CSV! Siap dilanjutkan.`, 'bg-blue-100 border-blue-500 text-blue-800');
            } else {
                calculateBunga(); 
                highlightLastFilled();
                showMessage(`❌ Gagal memuat data Saldo Harian. Pastikan file CSV tidak rusak.`, 'bg-red-100 border-red-500 text-red-800');
            }
        };

        reader.readAsText(file);
    }

    // --- INITIALIZATION ---
    window.onload = function() {
        calculateBunga();
        highlightLastFilled(); 
    }
</script>

</body>
</html>
