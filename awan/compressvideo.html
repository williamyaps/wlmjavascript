<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompresor Video Ringan</title>
    <!-- PERBAIKAN: Link CDN Tailwind yang benar -->
    <script src="tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-6 flex flex-col items-center justify-center">

    <div class="max-w-md w-full bg-gray-900 p-6 rounded-2xl shadow-2xl border border-gray-800">
        <h2 class="text-xl font-bold text-center mb-2 text-emerald-400">🎬 Kompresor Video Browser v2</h2>
        <p class="text-xs text-gray-400 text-center mb-6">Menggunakan akselerasi hardware internal peramban (Anti-Crash RAM).</p>

        <div class="mb-4">
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Pilih File Video:</label>
            <input type="file" id="videoInput" accept="video/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer">
        </div>

        <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Pilih Resolusi:</label>
            <select id="resSelect" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
                <option value="1280x720">720p (HD - Rekomendasi)</option>
                <option value="854x480">480p (SD - Ringan)</option>
                <option value="640x360">360p (Rendah - Sangat Cepat)</option>
            </select>
        </div>

        <button id="startBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold py-3 px-4 rounded-xl transition duration-200">
            Kompres Sekarang
        </button>

        <!-- Status -->
        <div id="statusBox" class="hidden mt-4 p-3 bg-gray-800 rounded-xl text-center">
            <p id="statusTxt" class="text-sm text-yellow-400 font-medium">Memproses...</p>
        </div>

        <!-- Output -->
        <div id="resultBox" class="hidden mt-6 text-center">
            <p class="text-sm text-emerald-400 font-bold mb-2">🎉 Kompresi Selesai!</p>
            <a id="dlLink" class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-6 rounded-xl transition">
                Unduh Hasil Video
            </a>
        </div>
    </div>

    <!-- Elemen tersembunyi untuk memproses video frame demi frame -->
    <canvas id="procCanvas" class="hidden"></canvas>

    <script>
        const videoInput = document.getElementById('videoInput');
        const resSelect = document.getElementById('resSelect');
        const startBtn = document.getElementById('startBtn');
        const statusBox = document.getElementById('statusBox');
        const statusTxt = document.getElementById('statusTxt');
        const resultBox = document.getElementById('resultBox');
        const dlLink = document.getElementById('dlLink');
        
        // Menggunakan MediaRecorder bawaan browser agar tidak memakan RAM besar
        startBtn.addEventListener('click', () => {
            if (!videoInput.files[0]) return alert('Pilih file videonya dulu!');
            
            statusBox.classList.remove('hidden');
            resultBox.classList.add('hidden');
            statusTxt.innerText = "Sedang menyiapkan pemrosesan video...";

            const file = videoInput.files[0];
            const videoUrl = URL.createObjectURL(file);
            const videoEl = document.createElement('video');
            videoEl.src = videoUrl;
            videoEl.muted = true;
            videoEl.playsInline = true;

            videoEl.onloadedmetadata = () => {
                const [targetWidth, targetHeight] = resSelect.value.split('x').map(Number);
                const canvas = document.getElementById('procCanvas');
                const ctx = canvas.getContext('2d');
                canvas.width = targetWidth;
                canvas.height = targetHeight;

                videoEl.play();

                // Menangkap stream dari canvas dengan resolusi yang sudah diturunkan
                const stream = canvas.captureStream(25); 
                const recorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm;codecs=vp8',
                    videoBitsPerSecond: 1200000 // Batasi bitrate di 1.2 Mbps agar ukuran file drop drastis
                });

                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    dlLink.href = url;
                    dlLink.download = "video_terkompresi.webm";
                    
                    statusBox.classList.add('hidden');
                    resultBox.classList.remove('hidden');
                    // Bersihkan memori browser
                    URL.revokeObjectURL(videoUrl);
                };

                recorder.start();
                statusTxt.innerText = "Video sedang direkam ulang ke ukuran lebih kecil... Silakan tunggu.";

                // Lakukan penggambaran frame video ke canvas secara berkala
                function drawFrame() {
                    if (videoEl.paused || videoEl.ended) {
                        recorder.stop();
                        return;
                    }
                    ctx.drawImage(videoEl, 0, 0, targetWidth, targetHeight);
                    requestAnimationFrame(drawFrame);
                }
                drawFrame();
            };
        });
    </script>
</body>
</html>
