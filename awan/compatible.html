<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Kosmik & Weton Jawa Fix</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: #f1f5f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        h1 { text-align: center; color: #818cf8; font-size: 20px; }
        .box { background: #0f172a; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #475569; }
        select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: none; font-size: 14px; }
        select { background: #334155; color: #fff; }
        button { background: #4f46e5; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #6366f1; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 10px; border-bottom: 1px solid #334155; text-align: left; }
        th { background: #0f172a; color: #94a3b8; }
        .result-box { background: #0c4a6e; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 13px; border-left: 4px solid #0284c7; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌌 Kalkulator Kosmik & Weton Jawa</h1>
    
    <div class="box">
        <label>👤 Tanggal Lahir Utama (Anda):</label>
        <select id="mainDate">
            <option value="15-05-1994">15 Mei 1994 (Minggu Legi)</option>
        </select>
    </div>

    <div class="box">
        <label>👥 Pilih Tanggal Pembanding:</label>
        <select id="compareDate">
            <option value="15-05-1994">15 Mei 1994 (Minggu Legi)</option>
            <option value="01-01-1999">1 Januari 1999 (Jumat Wage)</option>
            <option value="14-02-1999">14 Februari 1999 (Minggu Pon)</option>
            <option value="28-10-1977">28 Oktober 1977 (Jumat Kliwon)</option>
        </select>
        <button onclick="hitungKecocokan()">🔮 Hitung Kecocokan</button>
    </div>

    <div id="resultSection" class="hidden">
        <table>
            <thead>
                <tr>
                    <th>Kategori</th>
                    <th>Data Anda (15 Mei 1994)</th>
                    <th>Data Pasangan</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <div id="summaryText" class="result-box"></div>
    </div>
</div>

<script>
    // Database Akurat Hasil Kuncian Manual
    const db = {
        "15-05-1994": {
            tgl: "15 Mei 1994", weton: "Minggu Legi", neptu: 10, zodiak: "Taurus (Tanah)", shio: "Anjing Tanah",
            sifat: "Penyabar, berhati longgar, suka melindungi sesama, namun jika terlanjur marah sulit diredam."
        },
        "01-01-1999": {
            tgl: "1 Januari 1999", weton: "Jumat Wage", neptu: 10, zodiak: "Capricorn (Tanah)", shio: "Macan Tanah",
            sifat: "Rendah hati, penurut, setia, tenang, namun terkadang mudah terpengaruh oleh lingkungan."
        },
        "14-02-1999": {
            tgl: "14 Februari 1999", weton: "Minggu Pon", neptu: 12, zodiak: "Aquarius (Udara)", shio: "Kelinci Tanah",
            sifat: "Berjiwa pemimpin, amanah, suka menolong, tetapi memiliki harga diri yang sangat tinggi."
        },
        "28-10-1977": {
            tgl: "28 Oktober 1977", weton: "Jumat Kliwon", neptu: 14, zodiak: "Scorpio (Air)", shio: "Ular Api",
            sifat: "Pandai bergaul, menepati janji, berpendirian teguh, dan memiliki pengaruh atau karisma kuat."
        }
    };

    function hitungKecocokan() {
        const p1 = db["15-05-1994"];
        const p2 = db[document.getElementById('compareDate').value];
        
        // Logika Perjodohan Pembagi 8
        const totalNeptu = p1.neptu + p2.neptu;
        let hasilWeton = "", artiWeton = "";
        
        if (totalNeptu === 20) { hasilWeton = "PADU"; artiWeton = "Sering mengalami pertengkaran kecil, tetapi tidak sampai cerai."; }
        else if (totalNeptu === 22) { hasilWeton = "SUJANAN"; artiWeton = "Rawan mengalami perselisihan atau masalah perselingkuhan/kecemburuan."; }
        else if (totalNeptu === 24) { hasilWeton = "PESTHI"; artiWeton = "Sangat Baik. Rumah tangga rukun, adem ayem, dan harmonis sampai tua."; }

        // Update Tabel
        document.getElementById('tableBody').innerHTML = `
            <tr><td><b>Weton (Neptu)</b></td><td>${p1.weton} (${p1.neptu})</td><td>${p2.weton} (${p2.neptu})</td></tr>
            <tr><td><b>Zodiak (Elemen)</b></td><td>${p1.zodiak}</td><td>${p2.zodiak}</td></tr>
            <tr><td><b>Shio</b></td><td>${p1.shio}</td><td>${p2.shio}</td></tr>
            <tr><td><b>Sifat Bawaan</b></td><td>${p1.sifat}</td><td>${p2.sifat}</td></tr>
        `;

        // Update Hasil Akhir
        document.getElementById('summaryText').innerHTML = `
            <b>Hasil Hubungan (Primbon Jawa):</b><br>
            Total Neptu Gabungan: <b>${totalNeptu}</b> menghasilkan status <b>${hasilWeton}</b>.<br> 
            <i>"${artiWeton}"</i>
        `;

        document.getElementById('resultSection').classList.remove('hidden');
    }
</script>
</body>
</html>
