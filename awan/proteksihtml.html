<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENCRYPTOR v4.5 Online</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/argon2-browser/1.18.0/argon2-bundled.min.js"></script>
<script src="https://unpkg.com/libsodium-wrappers@0.7.15/dist/browsers/sodium.js"></script>
<style>
body{margin:0;background:#0f172a;color:#e2e8f0;font-family:Segoe UI;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{width:100%;max-width:520px;background:#1e293b;padding:28px;border-radius:16px}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}
button{background:#10b981;color:#000;font-weight:700;cursor:pointer}
#st{font-size:13px;color:#86efac;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<h2>ENCRYPTOR v4.5 (Online)</h2>
<input type="file" id="file" accept=".html,.htm">
<input type="password" id="pwd" placeholder="Password">
<input type="password" id="pwd2" placeholder="Ulangi Password">
<button id="go">Enkripsi Sekarang</button>
<div id="st"></div>
<a id="dl" style="display:none">download</a>
</div>

<script>
const $=id=>document.getElementById(id);
const st=$('st'), dl=$('dl');

async function ready(){
  await sodium.ready;
  st.textContent='sodium siap ✓';
}
ready();

$('go').onclick=async()=>{
  const f=$('file').files[0], pw=$('pwd').value, pw2=$('pwd2').value;
  if(!f||!pw||pw!==pw2) return alert('cek file & password');
  st.textContent='enkripsi jalan...';

  const html=await f.text();
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const nonce=crypto.getRandomValues(new Uint8Array(12));

  // PBKDF2 dulu biar argon2 dapat input stabil
  const pbkdf2=CryptoJS.PBKDF2(pw, CryptoJS.lib.WordArray.create(salt), {keySize:8, iterations:100000, hasher:CryptoJS.algo.SHA256}).toString(CryptoJS.enc.Hex);

  const argon=await argon2.hash({pass:pbkdf2, salt, time:3, mem:131072, hashLen:32, parallelism:1, type:argon2.ArgonType.Argon2id});
  const key=argon.hash;

  const aesKey=await crypto.subtle.importKey('raw', key, {name:'AES-GCM'}, false, ['encrypt']);
  const aesCt=await crypto.subtle.encrypt({name:'AES-GCM', iv}, aesKey, new TextEncoder().encode(html));

  const chacha=sodium.crypto_aead_chacha20poly1305_ietf_encrypt(new Uint8Array(aesCt), null, null, nonce, key);

  const out=new Uint8Array(16+16+12+12+chacha.length);
  out.set(crypto.getRandomValues(new Uint8Array(16)),0); // magic
  out.set(salt,16); out.set(iv,32); out.set(nonce,44); out.set(chacha,56);

  const b64=btoa(String.fromCharCode(...out));

  const tpl=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Protected</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/argon2-browser/1.18.0/argon2-bundled.min.js"><\/script>
<script src="https://unpkg.com/libsodium-wrappers@0.7.15/dist/browsers/sodium.js"><\/script>
<style>body{margin:0;background:#0f172a;color:#fff;font-family:Segoe UI;display:flex;align-items:center;justify-content:center;height:100vh}.b{background:#1e293b;padding:24px;border-radius:12px;width:320px;text-align:center}input,button{width:100%;padding:10px;margin:6px 0}</style>
</head><body><div class="b"><h3>🔒</h3><input id="p" type="password" placeholder="password"><button id="ok">Buka</button><div id="e" style="color:#f88"></div></div>
<script>
const DATA="__DATA__";
function u8(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
document.getElementById('ok').onclick=async()=>{
  await sodium.ready;
  try{
    const a=u8(DATA), s=a.slice(16,32), iv=a.slice(32,44), n=a.slice(44,56), ct=a.slice(56);
    const pw=document.getElementById('p').value;
    const pb=CryptoJS.PBKDF2(pw, CryptoJS.lib.WordArray.create(s), {keySize:8,iterations:100000,hasher:CryptoJS.algo.SHA256}).toString(CryptoJS.enc.Hex);
    const ar=await argon2.hash({pass:pb,salt:s,time:3,mem:131072,hashLen:32,parallelism:1,type:argon2.ArgonType.Argon2id});
    const k=ar.hash;
    const ch=sodium.crypto_aead_chacha20poly1305_ietf_decrypt(null, ct, null, n, k);
    const ak=await crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,['decrypt']);
    const pl=await crypto.subtle.decrypt({name:'AES-GCM',iv},ak,ch);
    const html=new TextDecoder().decode(pl);
    location.replace(URL.createObjectURL(new Blob([html],{type:'text/html'})));
  }catch(e){document.getElementById('e').textContent='password salah'}
}
<\/script></body></html>`;

  const final=tpl.replace('__DATA__', b64);
  const blob=new Blob([final],{type:'text/html'});
  dl.href=URL.createObjectURL(blob);
  dl.download=f.name.replace(/\.html?$/,'')+'-protected.html';
  dl.click();
  st.textContent='selesai ✓ file terdownload';
};
</script>
</body>
</html>
