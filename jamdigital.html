<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jam Digital Akurat & Cuaca</title>
    <style>
        /* CSS untuk Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        #jam-utama {
            font-size: 8em;
            font-weight: bold;
            letter-spacing: 5px;
            color: #4CAF50;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
            margin-bottom: 20px;
        }

        #info-tambahan {
            font-size: 1.5em;
            margin-bottom: 5px;
            color: #b0b0b0;
        }

        #cuaca-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
        }

        #suhu-utama {
            font-size: 4em; /* Suhu lebih besar */
            font-weight: 600;
            color: #2196F3;
        }

        #cuaca-info {
            text-align: left;
        }

        #lokasi {
            font-size: 2em;
            font-weight: 600;
        }

        #icon-cuaca {
            width: 100px;
            height: 100px;
        }
        
        #error-message {
            color: red; 
            margin-top: 10px; 
            font-size: 0.9em;
        }
        
        @media (max-width: 600px) {
            #jam-utama {
                font-size: 4em;
            }
            #suhu-utama {
                font-size: 3em;
            }
            #lokasi {
                font-size: 1.2em;
            }
            #cuaca-container {
                flex-direction: column;
            }
            #icon-cuaca {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>

    <div id="info-tambahan"></div>
    <div id="jam-utama"></div>

    <div id="cuaca-container">
        <img id="icon-cuaca" src="" alt="Icon Cuaca" style="visibility: hidden;">
        <div id="suhu-utama">--°C</div>
        <div id="cuaca-info">
            <div id="lokasi">Memuat...</div>
            <div id="deskripsi-cuaca" style="font-size: 1.2em;"></div>
        </div>
    </div>
    
    <div id="error-message"></div>

    <script>
        const jamUtama = document.getElementById('jam-utama');
        const infoTambahan = document.getElementById('info-tambahan');
        const suhuUtama = document.getElementById('suhu-utama');
        const lokasiElement = document.getElementById('lokasi');
        const iconCuaca = document.getElementById('icon-cuaca');
        const deskripsiCuaca = document.getElementById('deskripsi-cuaca');
        const errorMessage = document.getElementById('error-message');
        
        // GANTI DENGAN KUNCI API CUACA OPENWEATHERMAP ANDA YANG VALID!
        const API_KEY_CUACA = 'YOUR_API_KEY'; 
        
        const IP_API_URL = 'http://ip-api.com/json/'; 

        // 1. Update Jam dan Tanggal
        function updateJam() {
            const now = new Date();
            const jam = String(now.getHours()).padStart(2, '0');
            const menit = String(now.getMinutes()).padStart(2, '0');
            const detik = String(now.getSeconds()).padStart(2, '0');
            jamUtama.textContent = `${jam}:${menit}:${detik}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            infoTambahan.textContent = now.toLocaleDateString('id-ID', options);
        }
        
        // 2. Mengambil Cuaca dari Koordinat
        async function fetchCuaca(lat, lon) {
            try {
                const urlCuaca = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY_CUACA}&units=metric&lang=id`;
                
                const response = await fetch(urlCuaca);
                if (!response.ok) {
                     throw new Error('Gagal mengambil data cuaca. Periksa API Key Cuaca.');
                }
                const data = await response.json();

                const suhu = data.main.temp.toFixed(0); // Suhu dibulatkan ke bilangan bulat
                const lokasiNama = data.name; 
                const deskripsi = data.weather[0].description.toUpperCase();
                const iconCode = data.weather[0].icon;

                suhuUtama.textContent = `${suhu}°C`;
                lokasiElement.textContent = lokasiNama;
                deskripsiCuaca.textContent = deskripsi;
                
                // Menampilkan icon cuaca
                iconCuaca.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
                iconCuaca.style.visibility = 'visible';
                
            } catch (error) {
                suhuUtama.textContent = "--°C";
                lokasiElement.textContent = "Gagal Ambil Cuaca.";
                errorMessage.textContent = `Pesan: ${error.message}`;
                console.error("Error fetching weather data:", error);
            }
        }
        
        // 3. Fallback IP Geolocation (Jika Geolocation Browser Gagal/Ditolak)
        async function fallbackIP() {
            lokasiElement.textContent = "Memuat (IP Lokasi)...";
            try {
                const ipResponse = await fetch(IP_API_URL);
                const ipData = await ipResponse.json();
                
                if (ipData.status === 'success') {
                    // Gunakan Lat/Lon dari IP untuk mendapatkan cuaca
                    await fetchCuaca(ipData.lat, ipData.lon);
                    lokasiElement.textContent = `${ipData.city || ipData.regionName || 'Lokasi IP'} (${ipData.countryCode})`;
                } else {
                    throw new Error("Gagal fallback ke IP Lokasi.");
                }
            } catch (e) {
                lokasiElement.textContent = "Lokasi & Cuaca Gagal Diperoleh.";
                errorMessage.textContent = `Pesan: ${e.message}`;
            }
        }

        // 4. Utama: Coba Geolocation Browser Dulu
        function getLokasiDanSuhu() {
            lokasiElement.textContent = "Meminta Izin Lokasi...";
            iconCuaca.style.visibility = 'hidden';

            if (navigator.geolocation) {
                // Prioritas 1: Geolocation Browser (Akurat)
                navigator.geolocation.getCurrentPosition(async (position) => {
                    errorMessage.textContent = "";
                    await fetchCuaca(position.coords.latitude, position.coords.longitude);
                    // Lokasi nama sudah diisi oleh fetchCuaca
                }, async (error) => {
                    // Jika ditolak (error.code: 1) atau gagal, coba fallback ke IP
                    errorMessage.textContent = "Akses lokasi ditolak/gagal. Mencoba Lokasi IP...";
                    await fallbackIP();
                });
            } else {
                // Jika browser tidak mendukung, coba fallback ke IP
                fallbackIP();
            }
        }

        // Jalankan semua fungsi
        setInterval(updateJam, 1000);
        getLokasiDanSuhu();
        // Ulangi pengambilan suhu/lokasi setiap 15 menit (900000 ms)
        setInterval(getLokasiDanSuhu, 900000); 

        updateJam(); // Panggil sekali saat awal
    </script>

</body>
</html>
