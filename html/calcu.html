<script>
    // Inisialisasi MathQuill Engine
    var MQ = MathQuill.getInterface(2);
    var mathFieldSpan = document.getElementById('editable-math');
    var riwayatDatabase = [];
    
    var mathField = MQ.MathField(mathFieldSpan, {
        spaceBehavesLikeTab: true,
        handlers: {
            edit: function() {
                prosesKalkulasiRealtime();
            }
        }
    });

    // Kontrol Navigasi Tab UI
    function bukaTab(evt, tabId) {
        $('.tab-content').removeClass('active');
        $('.tab-btn').removeClass('active');
        $('#' + tabId).addClass('active');
        $(evt.currentTarget).addClass('active');
    }

    // Fungsi Pengendali Input Keyboard Virtual
    function inputTombol(str) { mathField.write(str); mathField.focus(); }
    function inputTulis(str) { mathField.write(str); mathField.focus(); }
    function inputCmd(str) { mathField.cmd(str); mathField.focus(); }
    function inputBackspace() { mathField.keystroke('Backspace'); mathField.focus(); }
    function inputClear() { mathField.latex(''); $('#result-display').text('0'); $('#card-render').text('INPUT KOSONG'); }

    // Parser Logika Matematika dari MathQuill Text ke JavaScript Evaluator
    function prosesKalkulasiRealtime() {
        var rawText = mathField.text();
        if(!rawText.strip) rawText = rawText.trim();
        if(rawText === "") {
            $('#result-display').text('0');
            return;
        }
        
        // Terjemahkan format bacaan MathQuill ke kode matematika JS standar
        var formula = rawText.replace(/[^a-zA-Z0-9+\-*/().^]/g, function(match) {
            if(match === '·') return '*';
          return match;});formula = formula.replace(/sin(/g, 'Math.sin(').replace(/cos(/g, 'Math.cos(').replace(/tan(/g, 'Math.tan(').replace(/log(/g, 'Math.log10(').replace(/ln(/g, 'Math.log(').replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E');// Pemrosesan Pangkat Luar (A^B -> Math.pow(A,B))while(formula.includes('^')) {formula = formula.replace(/([a-zA-Z0-9.()]+)^([a-zA-Z0-9.()]+)/g, "Math.pow($1,$2)");}// Abaikan kalkulasi otomatis dulu jika ada variabel fungsi kurva 'x'if(rawText.includes('x')) {$('#result-display').text("Format Fungsi f(x)");$('#card-render').text(rawText);return;}try {var hasil = eval(formula);if(!isNaN(hasil)) {if (Number.isInteger(hasil)) {$('#result-display').text(hasil);} else {$('#result-display').text(Number(hasil.toFixed(6)));}$('#card-render').text(rawText + " = " + $('#result-display').text());}} catch(e) {// Biarkan user menyelesaikan ketikan rumusnya dulu$('#result-display').text("Mengetik...");}}// Fungsi Menyimpan Data Riwayat Saat Tombol '=' Ditekanfunction hitungSelesai() {var rumus = mathField.text();var hasil = $('#result-display').text();if(!rumus || hasil === "Mengetik..." || hasil === "0") return;// Catat Waktu Lokal HP/Laptop secara akuratvar dt = new Date();var waktuStr = dt.getFullYear() + '-' +String(dt.getMonth()+1).padStart(2,'0') + '-' +String(dt.getDate()).padStart(2,'0') + ' ' +String(dt.getHours()).padStart(2,'0') + ':' +String(dt.getMinutes()).padStart(2,'0') + ':' +String(dt.getSeconds()).padStart(2,'0');riwayatDatabase.push({ waktu: waktuStr, rumus: rumus, hasil: hasil });// Perbarui Tampilan List Riwayat UIvar htmlList = "";for(var i = riwayatDatabase.length - 1; i >= 0; i--) {htmlList += "[" + riwayatDatabase[i].waktu + "] " +riwayatDatabase[i].rumus + " = " + riwayatDatabase[i].hasil + "";}$('#log-list').html(htmlList);}// Fungsi Ekspor Riwayat ke Format File CSV Langsung Unduh Ke Storage Perangkatfunction eksporCSV() {if(riwayatDatabase.length === 0) { alert("Belum ada riwayat kalukasi!"); return; }var csvContent = "Tanggal & Jam,Rumus Matematika,Hasil\n";riwayatDatabase.forEach(function(row) {csvContent += '"' + row.waktu + '","' + row.rumus + '","' + row.hasil + '"\n';});var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });var link = document.createElement("a");link.href = URL.createObjectURL(blob);link.setAttribute("download", "riwayat_kalkulator_ai.csv");document.body.appendChild(link);link.click();document.body.removeChild(link);}// Fungsi Konversi Area Preview Menjadi File Gambar PNG Tanpa Rusak/Copotfunction eksporPNG() {var targetArea = document.getElementById('capture-area');html2canvas(targetArea, { backgroundColor: '#0f172a' }).then(function(canvas) {var link = document.createElement('a');link.download = 'hasil_render_math_ai.png';link.href = canvas.toDataURL('image/png');document.body.appendChild(link);link.click();document.body.removeChild(link);});}
