<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kalkulator Rupiah Final</title>
<style>
body{font-family:sans-serif; display:flex; justify-content:center; margin-top:50px;}
.calculator{width:350px;}
.display{width:100%; font-size:2rem; text-align:right; padding:10px; margin-bottom:10px;}
button{width:20%; padding:15px; font-size:1rem; margin:2px;}
</style>
</head>
<body>
<div class="calculator">
<input type="text" id="display" class="display" oninput="formatInput()" />
<div>
<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button onclick="appendValue('/')">÷</button>
<button onclick="clearDisplay()">C</button>
</div>
<div>
<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button onclick="appendValue('*')">×</button>
<button onclick="deleteLast()">⌫</button>
</div>
<div>
<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button onclick="appendValue('-')">−</button>
<button onclick="appendValue('+')">+</button>
</div>
<div>
<button onclick="appendValue('0')">0</button>
<button onclick="appendValue('.')">.</button>
<button onclick="appendValue('%')">%</button>
<button onclick="calculate()">=</button>
</div>
</div>

<script>
const display = document.getElementById("display");

function appendValue(val){
  display.value += val;
  formatInput();
}

function clearDisplay(){display.value="";}
function deleteLast(){display.value = display.value.slice(0,-1); formatInput();}

// Format input real-time ribuan
function formatInput(){
  let val = display.value.replace(/\./g,'');
  // cek ada angka atau tidak
  let parts = val.split(/([+\-*/])/);
  for(let i=0;i<parts.length;i++){
    if(!isNaN(parts[i]) && parts[i]!==''){
      parts[i] = Number(parts[i]).toLocaleString('id-ID');
    }
  }
  display.value = parts.join('');
}

// Hitung persen manual
function calculate(){
  try{
    let exp = display.value.replace(/\./g,''); // hapus titik ribuan
    // regex cari angka% dan ubah jadi angka*0.01
    exp = exp.replace(/(\d+(?:\.\d+)?)%/g, '($1*0.01)');
    // split angka operator
    let result = Function('"use strict"; return (' + exp + ')')();
    result = Math.round(result*100)/100; // bulatkan 2 desimal
    display.value = result % 1 === 0 ? result.toLocaleString('id-ID') : result.toLocaleString('id-ID',{minimumFractionDigits:2, maximumFractionDigits:2});
  } catch(e){
    display.value="Error";
  }
}
</script>
</body>
</html>
