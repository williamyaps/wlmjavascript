<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Ilmiah - Dark Mode</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      margin: 0;
      color: #fff;
    }

    .calculator {
      background: #1e1e1e;
      border-radius: 15px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
      padding: 20px;
      width: 360px;
    }

    .display {
      width: 100%;
      height: 60px;
      border: none;
      border-radius: 10px;
      background: #2c2c2c;
      font-size: 2rem;
      text-align: right;
      padding-right: 15px;
      margin-bottom: 20px;
      box-sizing: border-box;
      color: #00e676;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    button {
      height: 55px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background-color: #333;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: #444;
      transform: scale(1.05);
    }

    button.operator {
      background-color: #00bcd4;
    }

    button.operator:hover {
      background-color: #0097a7;
    }

    button.equal {
      background-color: #00e676;
      color: #000;
      grid-column: span 2;
    }

    button.equal:hover {
      background-color: #00c853;
    }

    button.clear {
      background-color: #ff5252;
    }

    button.clear:hover {
      background-color: #e53935;
    }

    button.function {
      background-color: #607d8b;
    }

    button.function:hover {
      background-color: #546e7a;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" class="display" disabled />

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button class="function" onclick="appendValue('Math.PI')">π</button>
      <button class="function" onclick="appendValue('Math.E')">e</button>
      <button class="operator" onclick="appendValue('/')">÷</button>

      <button class="function" onclick="appendValue('Math.sin(')">sin</button>
      <button class="function" onclick="appendValue('Math.cos(')">cos</button>
      <button class="function" onclick="appendValue('Math.tan(')">tan</button>
      <button class="function" onclick="appendValue('Math.log10(')">log</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="function" onclick="appendValue('Math.sqrt(')">√</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="function" onclick="appendValue('**')">xʸ</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('(')">(</button>
      <button onclick="appendValue(')')">)</button>

      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    function appendValue(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = "";
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      try {
        let result = eval(display.value);
        display.value = result;
      } catch (error) {
        display.value = "Error";
      }
    }
  </script>
</body>
</html>
